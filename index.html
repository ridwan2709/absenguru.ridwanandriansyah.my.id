<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Guru</title>
    
    <!-- Load Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="icon" href="logo.png">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi Tailwind untuk Font Inter dan Desain Responsive -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#4f46e5',
                        'secondary': '#10b981',
                        'danger': '#ef4444',
                        'warning': '#f59e0b',
                    }
                }
            }
        }
    </script>
    
    <!-- Style kustom untuk body dan utility -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #map {
            width: 100%;
            height: 400px; /* Atur tinggi peta */
            border-radius: 0.5rem;
            z-index: 1;
        }
        /* Custom scrollbar styling for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 4px;
        }
        .scrollable-content {
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }
        /* Animation for notification */
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }
        
        /* Fix z-index untuk peta admin agar tidak menghalangi menu */
        #admin-map {
            position: relative;
            z-index: 1;
        }
        
        /* Pastikan header dan navigation memiliki z-index lebih tinggi */
        #main-header {
            z-index: 100;
        }
        
        .admin-tab-btn {
            position: relative;
            z-index: 10;
        }
        
        /* Leaflet controls z-index */
        .leaflet-control-container {
            z-index: 2 !important;
        }
        
        .leaflet-pane {
            z-index: 1 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header id="main-header" class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-10 hidden">
        <h1 class="text-2xl font-bold text-primary">Absensi Guru</h1>
        <div id="user-info" class="flex items-center space-x-4">
            <!-- Nama Pengguna dan Tombol Logout akan muncul di sini setelah login -->
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-container" class="flex-grow p-4 md:p-8 flex justify-center items-start">
        <!-- Konten (Login, Guru Dashboard, Admin Dashboard) akan dimuat di sini -->
    </main>

    <!-- Modal for Alert/Confirmation (Instead of window.alert/confirm) -->
    <div id="app-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm">
            <h3 id="modal-title" class="text-xl font-semibold mb-4 text-gray-800">Pesan</h3>
            <p id="modal-body" class="mb-6 text-gray-600">Isi pesan modal.</p>
            <div class="flex justify-end space-x-3">
                <button id="modal-cancel" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition duration-150 hidden">Batal</button>
                <button id="modal-confirm" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-indigo-600 transition duration-150">OK</button>
            </div>
        </div>
    </div>

    <!-- Load Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- PDF Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <!-- Load JavaScript Modules -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/map.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/guru.js"></script>
    <script src="assets/js/guru-schedule.js"></script>
    <script src="assets/js/guru-profile.js"></script>
    <script src="assets/js/admin.js"></script>
    <script src="assets/js/admin-guru.js"></script>
    <script src="assets/js/admin-jadwal.js"></script>
    <script src="assets/js/admin-laporan.js"></script>
    <script src="assets/js/admin-maps.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
